<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Clipboard Inspector</title>
  <link rel="stylesheet" href="inspector.css">
</head>

<body>
  <header class="app-bar">
    <div class="app-bar-title">
      <h1>Clipboard Inspector</h1>
      <span id="version-label"></span>
    </div>

    <div class="app-bar-actions">
      <!-- Zoom governs how big the preview panes draw the payload; the toggle
           beside it governs what they draw. Two different questions, so a
           hairline keeps them from reading as one cluster of controls. -->
      <div class="zoom" id="zoom">
        <button type="button" class="zoom-trigger" id="zoom-trigger" aria-haspopup="listbox"
          aria-expanded="false" aria-controls="zoom-menu" aria-label="Preview zoom">
          <span class="zoom-value" id="zoom-value">75%</span>
          <svg class="zoom-caret" viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.5 4.5 6 8l3.5-3.5" />
          </svg>
        </button>

        <ul class="zoom-menu" id="zoom-menu" role="listbox" aria-label="Preview zoom" hidden>
          <!-- The Fit row sat here, reading "Fit (61%)". It was taken out because
               it duplicates a step it sits beside: Fit only ever shrinks, so for
               any copy small enough to clear at the ceiling it reports exactly
               75%, directly above a row that reads 75%. The machinery behind it
               is still in inspector.js and still runs — computeFit decides which
               level a copy opens on — so putting the row back is this markup plus
               the separator under it, and nothing else. -->
          <li class="zoom-option" id="zoom-opt-25" role="option" data-zoom="0.25" aria-selected="false">25%</li>
          <li class="zoom-option" id="zoom-opt-50" role="option" data-zoom="0.5" aria-selected="false">50%</li>
          <li class="zoom-option" id="zoom-opt-75" role="option" data-zoom="0.75" aria-selected="false">75%</li>
          <li class="zoom-option" id="zoom-opt-90" role="option" data-zoom="0.9" aria-selected="false">90%</li>
          <li class="zoom-option" id="zoom-opt-100" role="option" data-zoom="1" aria-selected="false">100%</li>
          <li class="zoom-option" id="zoom-opt-125" role="option" data-zoom="1.25" aria-selected="false">125%</li>
          <li class="zoom-option" id="zoom-opt-150" role="option" data-zoom="1.5" aria-selected="false">150%</li>
        </ul>
      </div>

      <div class="app-bar-divider" aria-hidden="true"></div>

      <div class="segmented" id="view-toggle" role="group" aria-label="Preview mode">
        <button type="button" class="segment is-selected" data-view="rendered">Rendered</button>
        <button type="button" class="segment" data-view="source">Source</button>
      </div>
    </div>
  </header>

  <div id="loading">Reading clipboard... Make sure this window is focused.</div>
  <div id="error" class="error-msg" style="display: none;"></div>

  <div id="output-container"></div>
  <script src="lib/marked.min.js"></script>
  <script src="lib/turndown.js"></script>
  <script src="lib/turndown-plugin-gfm.js"></script>
  <script src="lib/purify.min.js"></script>
  <script src="lib/beautify-html.js"></script>
  <script src="tsv-detector.js"></script>
  <script src="inline-style.js"></script>
  <script src="equivalents.js"></script>
  <script src="inspector.js"></script>
</body>

</html>
